<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>彩の国 GPS追跡アプリ</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        #map { height: 70vh; width: 100%; }
        .controls { padding: 10px; background: #f8f9fa; display: flex; flex-direction: column; gap: 8px; }
        .timer { font-weight: bold; color: #d9534f; font-size: 0.9em; }
        .user-select { font-size: 1.1em; padding: 10px; width: 100%; }
        button { padding: 15px; font-size: 1em; cursor: pointer; border-radius: 5px; border: none; font-weight: bold; }
        .btn-main { background-color: #28a745; color: white; } /* 緑色で開始 */
        .btn-stop { background-color: #dc3545; color: white; } /* 赤色で停止 */
        .btn-center { background-color: #007bff; color: white; margin-top: 5px; } /* 青色で中心移動 */
    </style>
</head>
<body>
    <div id="map"></div>
    <div class="controls">
        <select id="user-name" class="user-select">
            <option value="かっくん">かっくん</option>
            <option value="のりちゃん">のりちゃん</option>
            <option value="渋くん">渋くん</option>
            <option value="原ちゃん">原ちゃん</option>
            <option value="かくちゃん">かくちゃん</option>
            <option value="ヨッシー">ヨッシー</option>
        </select>
        <button class="btn-main" id="toggle-btn" onclick="toggleAutoMode()">位置共有を開始</button>
        <button class="btn-center" onclick="moveToMyLocation()">自分の現在地へ移動</button>
        <div id="timer-display" class="timer">状態: 停止中</div>
    </div>

    <script>
const firebaseConfig = { 
            databaseURL: "https://sainokuni-gps-default-rtdb.firebaseio.com" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const map = L.map('map').setView([35.92, 139.15], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        new L.GPX("26Sainokuni-100mile.gpx", {
            async: true,
            marker_options: { startIconUrl: null, endIconUrl: null, shadowUrl: null }
        }).addTo(map);

        const markers = {};

        // 仲間の位置をリアルタイム受信
        db.ref('locations').on('value', (snapshot) => {
            const data = snapshot.val();
            for (let name in data) {
                const { lat, lon, time } = data[name];
                if (markers[name]) {
                    markers[name].setLatLng([lat, lon]);
                } else {
                    markers[name] = L.marker([lat, lon]).addTo(map).bindPopup(name + "<br>最終更新: " + time).openPopup();
                }
            }
        });

        let timerId = null;
        let timeLeft = 600;

        // 自分の場所にジャンプする関数
        function moveToMyLocation() {
            navigator.geolocation.getCurrentPosition((position) => {
                const { latitude, longitude } = position.coords;
                map.setView([latitude, longitude], 15);
            }, (err) => alert("位置情報が取得できません。設定を確認してください。"), { enableHighAccuracy: true });
        }

        function toggleAutoMode() {
            const btn = document.getElementById('toggle-btn');
            if (timerId) {
                clearInterval(timerId);
                timerId = null;
                btn.innerText = "位置共有を開始";
                btn.className = "btn-main";
                document.getElementById('timer-display').innerText = "状態: 停止中";
            } else {
                // ★ここがポイント：開始ボタンを押した瞬間に1回目を送信＆ジャンプ
                sendLocation();
                moveToMyLocation(); 
                
                startTimer();
                btn.innerText = "位置共有を停止";
                btn.className = "btn-stop";
            }
        }

        function startTimer() {
            timeLeft = 600;
            timerId = setInterval(() => {
                timeLeft--;
                document.getElementById('timer-display').innerText = `次回の自動更新まで: ${Math.floor(timeLeft/60)}分${timeLeft%60}秒`;
                if (timeLeft <= 0) {
                    sendLocation();
                    timeLeft = 600;
                }
            }, 1000);
        }

        function sendLocation() {
            const name = document.getElementById('user-name').value;
            navigator.geolocation.getCurrentPosition((position) => {
                const { latitude, longitude } = position.coords;
                db.ref('locations/' + name).set({
                    lat: latitude,
                    lon: longitude,
                    time: new Date().toLocaleTimeString()
                });
            }, (err) => console.error(err), { enableHighAccuracy: true });
        }
    </script>
</body>
</html>

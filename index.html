<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>彩の国 GPS追跡アプリ</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        #map { height: 70vh; width: 100%; }
        .controls { padding: 10px; background: #f8f9fa; display: flex; flex-direction: column; gap: 10px; }
        .timer { font-weight: bold; color: #d9534f; }
        .user-select { font-size: 1.1em; padding: 5px; }
    </style>
</head>
<body>
    <div id="map"></div>
    <div class="controls">
        <div>
            <label>自分はだれ？: </label>
            <select id="user-name" class="user-select">
                <option value="かっくん">かっくん</option>
                <option value="のりちゃん">のりちゃん</option>
                <option value="渋くん">渋くん</option>
                <option value="原ちゃん">原ちゃん</option>
                <option value="かくちゃん">かくちゃん</option>
                <option value="ヨッシー">ヨッシー</option>
            </select>
        </div>
        <button id="toggle-btn" onclick="toggleAutoMode()" style="padding: 15px;">自動送信を開始</button>
        <div id="timer-display" class="timer">自動更新: 停止中</div>
    </div>

    <script>
        // --- データの箱の設定（テスト用） ---
        const firebaseConfig = {
            databaseURL: "https://sainokuni-gps-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // --- 地図の基本設定 ---
        const map = L.map('map').setView([35.92, 139.15], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        // --- コースの読み込み ---
        new L.GPX("26Sainokuni-100mile.gpx", {
            async: true,
            marker_options: { startIconUrl: null, endIconUrl: null, shadowUrl: null }
        }).on('loaded', function(e) {
            map.fitBounds(e.target.getBounds());
        }).addTo(map);

        // --- 全員のピンを管理する場所 ---
        const markers = {};

        // --- ネット上のデータを監視して、ピンを動かす ---
        db.ref('locations').on('value', (snapshot) => {
            const data = snapshot.val();
            for (let name in data) {
                const { lat, lon } = data[name];
                if (markers[name]) {
                    markers[name].setLatLng([lat, lon]);
                } else {
                    markers[name] = L.marker([lat, lon]).addTo(map).bindPopup(name);
                }
            }
        });

        // --- 位置情報を送る機能 ---
        let timerId = null;
        let timeLeft = 600; // 10分

        function toggleAutoMode() {
            const btn = document.getElementById('toggle-btn');
            if (timerId) {
                clearInterval(timerId);
                timerId = null;
                btn.innerText = "自動送信を開始";
                btn.style.backgroundColor = "";
                document.getElementById('timer-display').innerText = "自動更新: 停止中";
            } else {
                sendLocation(); // 最初の一回を送信
                startTimer();
                btn.innerText = "送信を停止する";
                btn.style.backgroundColor = "#ffcccc";
            }
        }

        function startTimer() {
            timeLeft = 600;
            timerId = setInterval(() => {
                timeLeft--;
                document.getElementById('timer-display').innerText = `次回の送信まで: ${Math.floor(timeLeft/60)}分${timeLeft%60}秒`;
                if (timeLeft <= 0) {
                    sendLocation();
                    timeLeft = 600;
                }
            }, 1000);
        }

        function sendLocation() {
            const name = document.getElementById('user-name').value;
            navigator.geolocation.getCurrentPosition((position) => {
                const { latitude, longitude } = position.coords;
                // ネット上の箱に書き込む
                db.ref('locations/' + name).set({
                    lat: latitude,
                    lon: longitude,
                    time: new Date().toLocaleTimeString()
                });
            }, (err) => console.error(err), { enableHighAccuracy: true });
        }
    </script>
</body>
</html>
